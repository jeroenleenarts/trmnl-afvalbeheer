---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
polling_url: |
  {% comment %}
  streetname, cityname, email, and password are read by the transform.
  {% endcomment %}
  {% case collector %}
  {% when "mijnafvalwijzer" %}
  https://api.mijnafvalwijzer.nl/webservices/appsinput/?apikey={{ afvalwijzer_key | url_encode }}&method=postcodecheck&postcode={{ postcode | url_encode }}&street=&huisnummer={{ huisnummer | url_encode }}&toevoeging={{ suffix | url_encode }}&app_name=afvalwijzer&platform=web&afvaldata={{ "now" | date: "%Y-%m-%d" }}&langs=nl
  {% when "deafvalapp" %}
  https://dataservice.deafvalapp.nl/dataservice/DataServiceServlet?service=OPHAALSCHEMA&land=NL&postcode={{ postcode | url_encode }}&straatId=0&huisnr={{ huisnummer | url_encode }}&huisnrtoev={{ suffix | url_encode }}
  {% when "rova" %}
  https://www.rova.nl/api/waste-calendar/upcoming?houseNumber={{ huisnummer | url_encode }}&addition={{ suffix | url_encode }}&postalcode={{ postcode | url_encode }}&take=10
  {% when "amsterdam" %}
  https://api.data.amsterdam.nl/v1/afvalwijzer/afvalwijzer/?postcode={{ postcode | url_encode }}&huisnummer={{ huisnummer | url_encode }}{% if suffix %}&huisletter={{ suffix | url_encode }}{% endif %}
  {% when "alphenaandenrijn" %}
  https://afvalkalender.alphenaandenrijn.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "afval3xbeter" %}
  https://afval3xbeter.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "afvalstoffendienstkalender" %}
  https://afvalstoffendienst.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "berkelland" %}
  https://afvalkalender.gemeenteberkelland.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "cranendonck" %}
  https://afvalkalender.cranendonck.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "cyclus" %}
  https://cyclusnv.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "dar" %}
  https://afvalkalender.dar.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "defryskemarren" %}
  https://afvalkalender.defryskemarren.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "denhaag" %}
  https://huisvuilkalender.denhaag.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "gad" %}
  https://inzamelkalender.gad.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "hvc" %}
  https://inzamelkalender.hvcgroep.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "lingewaard" %}
  https://afvalwijzer.lingewaard.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "middelburg-vlissingen" %}
  https://afvalwijzer.middelburgvlissingen.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "mijnafvalzaken" %}
  https://mijnafvalzaken.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "montfoort" %}
  https://cyclusnv.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "offalkalinder" %}
  https://www.offalkalinder.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "peelenmaas" %}
  https://afvalkalender.peelenmaas.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "prezero" %}
  https://inzamelwijzer.prezero.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "purmerend" %}
  https://afvalkalender.purmerend.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "rwm" %}
  https://rwm.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "saver" %}
  https://saver.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "schouwen-duiveland" %}
  https://afvalkalender.schouwen-duiveland.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "sliedrecht" %}
  https://afvalkalender.sliedrecht.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "spaarnelanden" %}
  https://afvalwijzer.spaarnelanden.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "sudwestfryslan" %}
  https://afvalkalender.sudwestfryslan.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "uithoorn" %}
  https://cyclusnv.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "venray" %}
  https://afvalkalender.venray.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "voorschoten" %}
  https://afvalkalender.voorschoten.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "waalre" %}
  https://afvalkalender.waalre.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% when "zrd" %}
  https://www.zrd.nl/rest/adressen/{{ postcode | url_encode }}-{{ huisnummer | url_encode }}
  {% endcase %}
polling_headers: ''
polling_body: ''
id: 482665
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: Over
  description: 'Afvalkalender voor Nederlandse inzamelaars, gebaseerd op de Home Assistant <a href="https://github.com/pippyn/Home-Assistant-Sensor-Afvalbeheer">Afvalbeheer</a> collectors. Kies je inzamelaar en vul postcode en huisnummer in. RecycleApp vraagt een straatnaam, Limburg.NET ook een gemeente. Omrin-login is optioneel.

    '
  category: calendar,environment
  github_url: https://github.com/pippyn/Home-Assistant-Sensor-Afvalbeheer
- keyname: collector
  name: Afvalinzamelaar
  field_type: select
  default: circulus
  description: Inzamelaar van je gemeente, dezelfde namen als in Afvalbeheer.
  conditional_validation:
  - when: recycleapp
    visible:
    - streetname
    required:
    - streetname
  - when: limburg.net
    visible:
    - streetname
    - cityname
    required:
    - streetname
    - cityname
  - when: omrin
    visible:
    - email
    - password
  - when: mijnafvalwijzer
    visible:
    - afvalwijzer_key
  - when: assen
    visible:
    - burgerportaal_key
  - when: bar
    visible:
    - burgerportaal_key
  - when: groningen
    visible:
    - burgerportaal_key
  - when: nijkerk
    visible:
    - burgerportaal_key
  - when: rmn
    visible:
    - burgerportaal_key
  - when: tilburg
    visible:
    - burgerportaal_key
  options:
  - Circulus
  - ACV
  - Afval3xBeter
  - Afvalstoffendienstkalender
  - Almere
  - AlphenAanDenRijn
  - Amsterdam
  - AreaReiniging
  - Assen
  - Avalex
  - Avri
  - BAR
  - Berkelland
  - Blink
  - Cranendonck
  - Cyclus
  - DAR
  - DeAfvalApp
  - DeFryskeMarren
  - DenHaag
  - GAD
  - Groningen
  - Hellendoorn
  - HVC
  - Limburg.NET
  - Lingewaard
  - Meerlanden
  - Middelburg-Vlissingen
  - MijnAfvalwijzer
  - Mijnafvalzaken
  - Montfoort
  - Nijkerk
  - Offalkalinder
  - Omrin
  - Oostzaan
  - PeelEnMaas
  - PreZero
  - Purmerend
  - RAD
  - RecycleApp
  - RMN
  - ROVA
  - RWM
  - Saver
  - Schouwen-Duiveland
  - Sliedrecht
  - Spaarnelanden
  - SudwestFryslan
  - Tilburg
  - TwenteMilieu
  - Uithoorn
  - Venlo
  - Venray
  - Voorschoten
  - Waalre
  - Waardlanden
  - Westland
  - Woerden
  - Ximmio
  - ZRD
- keyname: postcode
  name: Postcode
  field_type: string
  placeholder: 7206AC
  description: Nederlandse postcode zonder spatie, of Belgische postcode voor RecycleApp.
  help_text: Bijvoorbeeld 7206AC of 1140
- keyname: huisnummer
  name: Huisnummer
  field_type: string
  placeholder: '1'
  description: Huisnummer van het adres.
- keyname: suffix
  name: Toevoeging
  field_type: string
  optional: true
  placeholder: A
  description: Optionele huisnummertoevoeging, zoals A of bis.
- keyname: streetname
  name: Straatnaam
  field_type: string
  optional: true
  placeholder: Bazellaan
  description: Nodig voor RecycleApp en Limburg.NET.
- keyname: cityname
  name: Gemeente
  field_type: string
  optional: true
  placeholder: Hasselt
  description: Nodig voor Limburg.NET.
- keyname: email
  name: E-mail
  field_type: string
  optional: true
  placeholder: naam@example.com
  description: Optioneel Omrin-account, alleen nodig voor extra app-gegevens.
- keyname: password
  name: Wachtwoord
  field_type: password
  optional: true
  description: Optioneel Omrin-wachtwoord. Wordt niet in de polling-URL gezet.
- keyname: afvalwijzer_key
  name: MijnAfvalwijzer API-sleutel
  field_type: string
  optional: true
  description: Publieke clientsleutel van MijnAfvalwijzer. Die staat in <a href="https://github.com/pippyn/Home-Assistant-Sensor-Afvalbeheer">Afvalbeheer</a> en wordt niet meegeleverd met deze recipe.
- keyname: burgerportaal_key
  name: Burgerportaal API-sleutel
  field_type: string
  optional: true
  description: Publieke Firebase-clientsleutel voor Assen, BAR, Groningen, Nijkerk, RMN en Tilburg. Die staat in <a href="https://github.com/pippyn/Home-Assistant-Sensor-Afvalbeheer">Afvalbeheer</a> en wordt niet meegeleverd met deze recipe.
name: Afvalbeheer
description: Nederlandse afvalkalender
refresh_interval: 360
